{{ define "main" }}
<article class="single">
  <section>
    <h3>{{ .Title }}</h3>
    {{ with .Params.liveURL }}
      <p>Live Build:
        <a href="{{ . }}">{{ replace . "https://" "" }}</a>
      </p>
    {{ end }}

  {{ with .Params.cover }}
    {{ $cover := $.Resources.GetMatch . }}
    {{ with $cover }}
      <figure class="article-cover">
        <img src="{{ .RelPermalink }}" alt="{{ $.Params.coverAlt }}" loading="lazy">
      </figure>
    {{ end }}
  {{ end }}

    <div class="article-content">
    {{ .Content }}
    </div>
    {{ partial "tags.html" . }}
  </section>
</article>
{{ end }}
