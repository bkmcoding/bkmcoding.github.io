{{ define "main" }}
<article>
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="taxonomy-list">
    {{ range .Data.Terms.ByCount }}
      <a class="term-card" href="{{ .Page.RelPermalink }}">
        <span>#{{ .Page.Title }}</span>
        <span>{{ .Count }}</span>
      </a>
    {{ end }}
  </div>
</article>
{{ end }}
